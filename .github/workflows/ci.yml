name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tools
        run: pip install black ruff

      - name: Check formatting (black)
        run: black --check analysis/ tests/ create_test_data.py

      - name: Lint (ruff)
        run: ruff check analysis/ tests/ create_test_data.py

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t scrnaseq-analysis:ci \
            -f docker/Dockerfile \
            .

      - name: Run tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint /usr/local/bin/_entrypoint.sh \
            scrnaseq-analysis:ci \
            python -m pytest -v

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            scrnaseq-analysis:ci \
            ghcr.io/rmr42/scrnaseq-analysis:latest

          docker tag \
            scrnaseq-analysis:ci \
            ghcr.io/rmr42/scrnaseq-analysis:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/rmr42/scrnaseq-analysis:latest
          docker push ghcr.io/rmr42/scrnaseq-analysis:${{ github.sha }}